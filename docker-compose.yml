version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_ENABLE_SSL: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_FROM: ${GMAIL_FROM}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL}
      FACE_SERVICE_API_KEY: ${FACE_SERVICE_API_KEY}
      FACE_CONFIDENCE_THRESHOLD: ${FACE_CONFIDENCE_THRESHOLD}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      PI_API_KEY: ${PI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_OPTIONS: ${NODE_OPTIONS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add face microservice if hosting locally
  # face-service:
  #   build:
  #     context: ./face-microservice
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     FLASK_ENV: production
  #     FLASK_PORT: 5000
  #     CONFIDENCE_THRESHOLD: 0.65

networks:
  default:
    name: secureapp-network
